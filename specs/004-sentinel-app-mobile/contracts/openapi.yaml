openapi: 3.0.3
info:
  title: Sentinel App API
  description: Gate Guard Access Control API for residential community security management
  version: 1.0.0
  contact:
    name: Village Tech API Support
    email: support@villagetech.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.villagetech.com/v1
    description: Production server
  - url: https://dev-api.villagetech.com/v1
    description: Development server

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Authentication
    description: Guard authentication and session management
  - name: RFID
    description: RFID sticker verification and management
  - name: Guests
    description: Guest registration and management
  - name: Entries
    description: Entry logging and tracking
  - name: Deliveries
    description: Delivery tracking and management
  - name: Construction
    description: Construction permit verification
  - name: Incidents
    description: Incident reporting and management
  - name: Rules
    description: Village rules and guidelines
  - name: Announcements
    description: Admin announcements and notifications
  - name: Sync
    description: Offline synchronization

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Guard login
      description: Authenticate guard credentials and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh authentication token
      description: Refresh access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Guard logout
      description: Terminate guard session
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/biometric:
    post:
      tags:
        - Authentication
      summary: Biometric verification
      description: Verify biometric authentication for sensitive operations
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BiometricRequest'
      responses:
        '200':
          description: Biometric verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BiometricResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rfid/verify:
    post:
      tags:
        - RFID
      summary: Verify RFID sticker
      description: Validate RFID sticker and return associated information
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RfidVerifyRequest'
      responses:
        '200':
          description: RFID verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfidVerifyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'

  /rfid/stickers:
    get:
      tags:
        - RFID
      summary: List RFID stickers
      description: Get list of active RFID stickers for tenant
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, expired, disabled, lost]
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of RFID stickers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfidStickersResponse'

  /rfid/stickers/{id}:
    put:
      tags:
        - RFID
      summary: Update RFID sticker
      description: Update RFID sticker status or information
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RfidUpdateRequest'
      responses:
        '200':
          description: RFID sticker updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RfidStickerResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'

  /guests:
    get:
      tags:
        - Guests
      summary: List guests
      description: Get list of registered guests for today or specified date
      security:
        - BearerAuth: []
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: household_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, checked_in, checked_out, cancelled]
      responses:
        '200':
          description: List of guests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestsResponse'

    post:
      tags:
        - Guests
      summary: Register guest
      description: Register new guest for household
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestRegisterRequest'
      responses:
        '201':
          description: Guest registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /guests/{id}/check-in:
    put:
      tags:
        - Guests
      summary: Check in guest
      description: Record guest arrival at gate
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Guest checked in successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /guests/{id}/check-out:
    put:
      tags:
        - Guests
      summary: Check out guest
      description: Record guest departure from gate
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Guest checked out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /entries:
    post:
      tags:
        - Entries
      summary: Create entry log
      description: Log new entry/exit at gate
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreateRequest'
      responses:
        '201':
          description: Entry log created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

    get:
      tags:
        - Entries
      summary: Search entry logs
      description: Search and filter entry logs
      security:
        - BearerAuth: []
      parameters:
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
        - name: entry_type
          in: query
          schema:
            type: string
            enum: [resident, guest, delivery, construction, other]
        - name: guard_id
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntriesResponse'

  /entries/today:
    get:
      tags:
        - Entries
      summary: Today's entries
      description: Get all entries for today
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Today's entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntriesResponse'

  /entries/{id}/exit:
    put:
      tags:
        - Entries
      summary: Record exit time
      description: Update entry log with exit time
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Exit time recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /deliveries:
    get:
      tags:
        - Deliveries
      summary: List deliveries
      description: Get list of scheduled and active deliveries
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, in_progress, completed, cancelled]
        - name: date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of deliveries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveriesResponse'

    post:
      tags:
        - Deliveries
      summary: Create delivery
      description: Log new delivery arrival
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryCreateRequest'
      responses:
        '201':
          description: Delivery created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /deliveries/{id}/complete:
    put:
      tags:
        - Deliveries
      summary: Complete delivery
      description: Mark delivery as completed and record exit time
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Delivery completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /construction/permits:
    get:
      tags:
        - Construction
      summary: List construction permits
      description: Get list of active construction permits
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, completed, suspended, cancelled]
        - name: household_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of construction permits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructionPermitsResponse'

  /construction/permits/{id}/verify:
    post:
      tags:
        - Construction
      summary: Verify construction permit
      description: Verify construction permit and check worker authorization
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstructionVerifyRequest'
      responses:
        '200':
          description: Permit verification successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstructionVerifyResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'

  /incidents:
    get:
      tags:
        - Incidents
      summary: List incidents
      description: Get list of incident reports
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, investigating, resolved, closed]
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: start_date
          in: query
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of incidents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentsResponse'

    post:
      tags:
        - Incidents
      summary: Create incident report
      description: File new incident report
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentCreateRequest'
      responses:
        '201':
          description: Incident report created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /incidents/{id}/resolve:
    put:
      tags:
        - Incidents
      summary: Resolve incident
      description: Mark incident as resolved
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentResolveRequest'
      responses:
        '200':
          description: Incident resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /incidents/{id}/photos:
    post:
      tags:
        - Incidents
      summary: Upload incident photos
      description: Upload photo evidence for incident report
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photos:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Photos uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentPhotosResponse'

  /rules:
    get:
      tags:
        - Rules
      summary: Get village rules
      description: Get list of active village rules and guidelines
      security:
        - BearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
            enum: [security, parking, noise, amenities, general]
      responses:
        '200':
          description: List of village rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulesResponse'

  /announcements:
    get:
      tags:
        - Announcements
      summary: Get announcements
      description: Get list of announcements for guards
      security:
        - BearerAuth: []
      parameters:
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - name: unread_only
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: List of announcements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementsResponse'

  /announcements/{id}/acknowledge:
    post:
      tags:
        - Announcements
      summary: Acknowledge announcement
      description: Mark announcement as read and acknowledged
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Announcement acknowledged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /sync/pending:
    get:
      tags:
        - Sync
      summary: Get pending operations
      description: Get list of pending offline operations to sync
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of pending operations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPendingResponse'

  /sync/operations:
    post:
      tags:
        - Sync
      summary: Submit offline operations
      description: Submit batch of offline operations for synchronization
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncOperationsRequest'
      responses:
        '200':
          description: Operations processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncOperationsResponse'

  /sync/status:
    get:
      tags:
        - Sync
      summary: Get sync status
      description: Get current synchronization status and statistics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatusResponse'

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
        - tenant_code
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        tenant_code:
          type: string
        device_info:
          type: string
        app_version:
          type: string

    LoginResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - guard
        - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        guard:
          $ref: '#/components/schemas/Guard'
        tenant:
          $ref: '#/components/schemas/Tenant'

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    RefreshTokenResponse:
      type: object
      required:
        - access_token
        - expires_in
      properties:
        access_token:
          type: string
        expires_in:
          type: integer

    BiometricRequest:
      type: object
      required:
        - biometric_data
        - operation_type
      properties:
        biometric_data:
          type: string
        operation_type:
          type: string
          enum: [login, sensitive_action, approve_entry]

    BiometricResponse:
      type: object
      required:
        - verified
        - timestamp
      properties:
        verified:
          type: boolean
        timestamp:
          type: string
          format: date-time

    RfidVerifyRequest:
      type: object
      required:
        - sticker_code
      properties:
        sticker_code:
          type: string
        scan_timestamp:
          type: string
          format: date-time

    RfidVerifyResponse:
      type: object
      required:
        - valid
        - sticker
      properties:
        valid:
          type: boolean
        sticker:
          $ref: '#/components/schemas/RfidSticker'
        resident:
          $ref: '#/components/schemas/Resident'
        verification_timestamp:
          type: string
          format: date-time

    RfidUpdateRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, expired, disabled, lost]
        notes:
          type: string

    GuestRegisterRequest:
      type: object
      required:
        - household_id
        - guest_name
        - phone_number
        - scheduled_date
        - expected_arrival
        - purpose
      properties:
        household_id:
          type: string
        guest_name:
          type: string
        phone_number:
          type: string
        scheduled_date:
          type: string
          format: date
        expected_arrival:
          type: string
          format: time
        expected_departure:
          type: string
          format: time
        purpose:
          type: string
        vehicle_info:
          type: string
        notes:
          type: string

    EntryCreateRequest:
      type: object
      required:
        - entry_type
        - person_name
        - verification_method
        - destination
      properties:
        entry_type:
          type: string
          enum: [resident, guest, delivery, construction, other]
        person_name:
          type: string
        vehicle_info:
          type: string
        rfid_sticker_id:
          type: string
        guest_id:
          type: string
        delivery_id:
          type: string
        construction_permit_id:
          type: string
        destination:
          type: string
        purpose:
          type: string
        verification_method:
          type: string
          enum: [rfid, manual, phone_call, permit]
        verification_status:
          type: string
          enum: [verified, pending, denied]
        notes:
          type: string

    DeliveryCreateRequest:
      type: object
      required:
        - household_id
        - delivery_company
        - delivery_person
        - contact_phone
        - package_type
      properties:
        household_id:
          type: string
        delivery_company:
          type: string
        delivery_person:
          type: string
        contact_phone:
          type: string
        package_type:
          type: string
          enum: [package, food, document, furniture]
        recipient_name:
          type: string
        special_instructions:
          type: string
        is_perishable:
          type: boolean
        notes:
          type: string

    IncidentCreateRequest:
      type: object
      required:
        - incident_type
        - severity
        - title
        - description
        - location
      properties:
        incident_type:
          type: string
          enum: [security_breach, rule_violation, emergency, maintenance]
        severity:
          type: string
          enum: [low, medium, high, critical]
        title:
          type: string
        description:
          type: string
        location:
          type: string
        violator_name:
          type: string
        violator_info:
          type: string
        incident_time:
          type: string
          format: date-time

    IncidentResolveRequest:
      type: object
      required:
        - resolution_notes
      properties:
        resolution_notes:
          type: string

    ConstructionVerifyRequest:
      type: object
      required:
        - worker_name
      properties:
        worker_name:
          type: string
        worker_id:
          type: string
        notes:
          type: string

    SyncOperationsRequest:
      type: object
      required:
        - operations
      properties:
        operations:
          type: array
          items:
            type: object
            required:
              - id
              - operation
              - entity_type
              - entity_id
              - payload
              - timestamp
            properties:
              id:
                type: string
              operation:
                type: string
                enum: [CREATE, UPDATE, DELETE]
              entity_type:
                type: string
              entity_id:
                type: string
              payload:
                type: object
              timestamp:
                type: string
                format: date-time

    Guard:
      type: object
      required:
        - id
        - tenant_id
        - email
        - full_name
        - role
        - is_active
      properties:
        id:
          type: string
        tenant_id:
          type: string
        email:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [head_guard, guard_officer, guard_trainee]
        phone:
          type: string
        employee_id:
          type: string
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Tenant:
      type: object
      required:
        - id
        - name
        - address
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        contact_email:
          type: string
        contact_phone:
          type: string
        subscription_status:
          type: string
          enum: [active, trial, suspended]
        max_residences:

openapi: 3.0.3
info:
  title: RFID Verification API
  description: API contract for RFID sticker verification and resident vehicle validation
  version: 1.0.0
  contact:
    name: Village Tech v4 API Team

servers:
  - url: https://{project-id}.supabase.co/functions/v1
    description: Supabase Edge Functions
    variables:
      project-id:
        default: your-project-id
        description: Your Supabase project ID

paths:
  /rfid/validate:
    post:
      summary: Validate RFID sticker
      description: Validates RFID sticker code and returns resident/vehicle information
      operationId: validateRFID
      tags:
        - RFID Verification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sticker_code
                - guard_id
                - gate_location
              properties:
                sticker_code:
                  type: string
                  description: RFID sticker unique code
                  example: "RFID-2024-ABC123"
                guard_id:
                  type: string
                  format: uuid
                  description: ID of guard performing validation
                gate_location:
                  type: string
                  description: Gate location identifier
                  example: "Main Gate"
                timestamp:
                  type: string
                  format: date-time
                  description: Scan timestamp (defaults to server time if not provided)
      responses:
        '200':
          description: Validation successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    description: Whether sticker is valid
                  status:
                    type: string
                    enum: [active, expired, revoked, lost]
                    description: Sticker status
                  household:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      address:
                        type: string
                      resident_name:
                        type: string
                      contact:
                        type: string
                  vehicle:
                    type: object
                    properties:
                      plate:
                        type: string
                      make:
                        type: string
                      model:
                        type: string
                      color:
                        type: string
                  sticker_info:
                    type: object
                    properties:
                      issued_date:
                        type: string
                        format: date
                      expiry_date:
                        type: string
                        format: date
                      days_until_expiry:
                        type: integer
                  verification_result:
                    type: string
                    enum: [granted, denied]
                    description: Entry decision
                  denial_reason:
                    type: string
                    description: Reason if entry denied
                    nullable: true
              examples:
                valid_sticker:
                  summary: Valid active sticker
                  value:
                    valid: true
                    status: active
                    household:
                      id: 123e4567-e89b-12d3-a456-426614174000
                      address: "Block A, Lot 15"
                      resident_name: "John Doe"
                      contact: "+63912345678"
                    vehicle:
                      plate: "ABC-1234"
                      make: "Toyota"
                      model: "Fortuner"
                      color: "Silver"
                    sticker_info:
                      issued_date: "2024-01-15"
                      expiry_date: "2025-01-15"
                      days_until_expiry: 97
                    verification_result: granted
                    denial_reason: null
                expired_sticker:
                  summary: Expired sticker
                  value:
                    valid: false
                    status: expired
                    household:
                      id: 123e4567-e89b-12d3-a456-426614174000
                      address: "Block A, Lot 15"
                      resident_name: "John Doe"
                      contact: "+63912345678"
                    vehicle:
                      plate: "ABC-1234"
                      make: "Toyota"
                      model: "Fortuner"
                      color: "Silver"
                    sticker_info:
                      issued_date: "2023-01-15"
                      expiry_date: "2024-01-15"
                      days_until_expiry: -279
                    verification_result: denied
                    denial_reason: "RFID sticker has expired"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Sticker code not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "RFID sticker not found in system"
                  verification_result:
                    type: string
                    example: denied
                  denial_reason:
                    type: string
                    example: "Unregistered RFID sticker"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rfid/log-entry:
    post:
      summary: Log RFID-verified entry
      description: Creates entry log for RFID-verified resident vehicle
      operationId: logRFIDEntry
      tags:
        - RFID Verification
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sticker_code
                - guard_id
                - verification_status
              properties:
                sticker_code:
                  type: string
                  description: RFID sticker code that was validated
                guard_id:
                  type: string
                  format: uuid
                verification_status:
                  type: string
                  enum: [granted, denied]
                denial_reason:
                  type: string
                  description: Required if verification_status is 'denied'
                  nullable: true
                notes:
                  type: string
                  description: Optional guard notes
                  nullable: true
                timestamp:
                  type: string
                  format: date-time
                  description: Entry timestamp
      responses:
        '201':
          description: Entry logged successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  entry_log_id:
                    type: string
                    format: uuid
                  message:
                    type: string
                    example: "Entry logged successfully"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase JWT token for authenticated guard

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details
          nullable: true

tags:
  - name: RFID Verification
    description: RFID sticker validation and entry logging operations

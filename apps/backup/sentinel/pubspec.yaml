name: sentinel
description: Sentinel App - Gate Guard Access Control Mobile Application
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Supabase Backend
  supabase_flutter: ^2.5.0

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^14.0.0

  # Local Storage & Encryption
  drift: ^2.14.0
  drift_sqflite: ^2.0.0
  sqlcipher_flutter_libs: ^0.6.1
  flutter_secure_storage: ^9.0.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # RFID/NFC
  # nfc_manager: ^3.3.0  # TODO: Find version compatible with Flutter 3.24+

  # Background Services
  # workmanager: ^0.5.2  # TODO: Find alternative compatible with Flutter 3.24+
  connectivity_plus: ^5.0.0
  flutter_background_service: ^5.0.0

  # Push Notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Utilities
  envied: ^0.5.0
  logger: ^2.0.0
  intl: ^0.19.0
  uuid: ^4.2.1
  equatable: ^2.0.5

  # UI & Validation
  flutter_screenutil: ^5.9.0
  json_annotation: ^4.8.1

  # HTTP & Network
  http: ^1.1.0
  dio: ^5.4.0

  # Image handling
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  flutter_image_compress: ^2.0.4

  # Device info
  device_info_plus: ^9.1.0
  permission_handler: ^11.0.0

  # Date & Time
  timezone: ^0.9.2

  # Security
  local_auth: ^2.1.6

  # QR Codes (for construction permits)
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  very_good_analysis: ^6.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0
  drift_dev: ^2.14.0
  envied_generator: ^0.5.0
  json_serializable: ^6.7.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env

  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700

# flutter_native_splash:
#   color: "#1a73e8"
#   image: assets/images/sentinel_logo.png
#   android_gravity: center
#   ios_content_mode: center

# Environment configuration
envied:
  env_file: .env
  output: lib/generated/env.dart
